<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CivicLens - photo to civic complaint draft</title>
<meta name="description" content="Turn a photo of a civic problem into a clear, evidence-grounded complaint draft in English or Hindi. Nothing is submitted for you.">
<meta name="theme-color" content="#0b2545">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b2545'/%3E%3Ccircle cx='15' cy='15' r='7' fill='none' stroke='%232dd4bf' stroke-width='3'/%3E%3Cpath d='M20 20l6 6' stroke='%232dd4bf' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="/" aria-label="CivicLens home">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b2545"/><circle cx="15" cy="15" r="7" fill="none" stroke="#2dd4bf" stroke-width="3"/><path d="M20 20l6 6" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/></svg>
      <span class="brand-name">CivicLens</span>
    </a>
    <span class="draft-chip" data-i18n="chip">Drafts only. Nothing is submitted.</span>
    <div class="seg" role="group" aria-label="Interface language" id="ui-lang">
      <button type="button" data-lang="en" aria-pressed="true" lang="en">English</button>
      <button type="button" data-lang="hi" aria-pressed="false" lang="hi">हिन्दी</button>
    </div>
  </div>
</header>

<nav class="wrap steps-wrap" aria-label="Progress"><ol class="steps" id="steps"></ol></nav>
<div class="wrap" id="banners" role="region" aria-label="Notices"></div>
<main id="main" class="wrap" tabindex="-1"></main>

<footer class="foot">
  <div class="wrap">
    <p data-i18n="disclaimer">AI can be wrong. Please review and edit every draft before you use it. CivicLens does not submit anything, and your photo is processed for this session and not stored.</p>
  </div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
